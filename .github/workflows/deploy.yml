# 素来有调工作台 → GitHub Pages 自动部署
# 触发：push 到 main / master，或在 Actions 页手动运行 workflow_dispatch
name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

# GITHUB_TOKEN 需要这三个权限才能部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个部署任务在跑，不取消已开始的生产部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 只上传构建产物 dist/，vite.config.js 已设 base:'./'，子路径可正常加载
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
